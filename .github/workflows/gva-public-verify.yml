name: VERIMETRIUM Free GVA Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable ledger chain and negative tests
        run: |
          python gva/issuer.py verify
          python -m unittest discover -s gva/tests -v
